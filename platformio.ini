; PlatformIO Project Configuration File
;
; Touch-controlled dimmable lamp controller — see lamp-controller-build-spec.md
; and hardware.md for wiring.

[env:xiao]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6      ; TODO: set seeed_xiao_esp32c3 if that is the board in use
framework = arduino
monitor_speed = 115200
; No filesystem is used; min_spiffs gives two ~1.9 MB app slots so OTA keeps working.
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    adafruit/Adafruit MPR121 @ ^1.2.1
    knolleary/PubSubClient @ ^2.8
    hoeken/PsychicHttp @ ^3.1.2
    ; Pinned to a post-v2.0.0 commit: the v2.0.0 tag predates an ESP-IDF 5.5
    ; timer-ISR fix and won't compile against the current pioarduino toolchain.
    https://github.com/robotdyn-dimmer/rbdimmerESP32.git#ab7307d56c3f02a766485be8e9884eef4bdffba0

; Over-the-air upload. Flash once over USB, then: pio run -e xiao_ota -t upload
[env:xiao_ota]
extends = env:xiao
upload_protocol = espota
upload_port = living-room-lamp.local.solace.org

; Host-native unit tests for the gesture state machine (no hardware).
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
