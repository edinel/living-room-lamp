; PlatformIO Project Configuration File
;
; Touch-controlled dimmable lamp controller — see lamp-controller-build-spec.md
; and hardware.md for wiring.

[platformio]
; Toolbar buttons and a bare `pio run` act on this env only.
; xiao_ota and native are opt-in: `pio run -e xiao_ota -t upload`, `pio test -e native`.
default_envs = xiao

[env:xiao]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
; No filesystem is used; min_spiffs gives two ~1.9 MB app slots so OTA keeps working.
board_build.partitions = min_spiffs.csv
extra_scripts = pre:scripts/build_id.py
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1   ; route Serial to native USB so boot logs are captured
lib_deps =
    ; MPR121 is driven directly in lib/TouchPanel — Adafruit_BusIO's repeated-START
    ; reads hit ESP_ERR_INVALID_STATE on the i2c-ng driver.
    ; TRIAC firing is our own ISR code in lib/LampDimmer (rbdimmerESP32 fired from
    ; the esp_timer task, which WiFi delayed by up to ~0.85 ms — see hardware.md).
    knolleary/PubSubClient @ ^2.8
    hoeken/PsychicHttp @ ^3.1.2

; Over-the-air upload. Flash once over USB, then: pio run -e xiao_ota -t upload
[env:xiao_ota]
extends = env:xiao
upload_protocol = espota
upload_port = living-room-lamp.local.solace.org

; XIAO ESP32-S3: same footprint and D-pad jobs as the C6. Dual core, so the
; dimmer interrupts run on core 1 and WiFi stays on core 0.
[env:xiao_s3]
extends = env:xiao
board = seeed_xiao_esp32s3

[env:xiao_s3_ota]
extends = env:xiao_s3
upload_protocol = espota
upload_port = living-room-lamp.local.solace.org

; Bench proof on a bare S3 over USB (no mains, no dimmer): fake zero-cross on
; D4 — jumper D4 to D2. Hostname lamp-bench, MQTT off.
[env:xiao_s3_bench]
extends = env:xiao_s3
build_flags =
    ${env:xiao.build_flags}
    -DBENCH_FAKE_ZC

; Host-native unit tests for the gesture state machine (no hardware).
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
; Test-only env: don't compile the Arduino sources / libs on a bare `pio run`.
build_src_filter = -<*>
lib_ignore = LampDimmer, TouchPanel
