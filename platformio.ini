; PlatformIO Project Configuration File
;
; Touch-controlled dimmable lamp controller — see lamp-controller-build-spec.md
; and hardware.md for wiring.

[env:xiao]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6      ; TODO: set seeed_xiao_esp32c3 if that is the board in use
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    adafruit/Adafruit MPR121
    knolleary/PubSubClient @ ^2.8
    hoeken/PsychicHttp
    https://github.com/robotdyn-dimmer/rbdimmerESP32.git

; Over-the-air upload. Flash once over USB, then: pio run -e xiao_ota -t upload
[env:xiao_ota]
extends = env:xiao
upload_protocol = espota
upload_port = living-room-lamp.local

; Host-native unit tests for the gesture state machine (no hardware).
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
